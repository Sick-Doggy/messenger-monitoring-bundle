services:
    SickDoggy\MessengerMonitoring\Middleware\MonitoringMiddleware:
        autowire: true

    SickDoggy\MessengerMonitoring\EventSubscriber\MessageLifecycleSubscriber:
        autowire: true
        tags:
            - { name: kernel.event_subscriber }

    SickDoggy\MessengerMonitoring\Client\StoreClient:
        autowire: true
        arguments:
            $baseUrl: '%messenger_monitoring.endpoint%'
            $apiKey: '%messenger_monitoring.api_key%'
            $timeout: '%messenger_monitoring.timeout%'

    SickDoggy\MessengerMonitoring\Report\StoreLifecycleReporter:
        autowire: true
        bind:
            Psr\Log\LoggerInterface: '@logger'

    SickDoggy\MessengerMonitoring\Report\LifecycleReporter: '@SickDoggy\MessengerMonitoring\Report\StoreLifecycleReporter'

    SickDoggy\MessengerMonitoring\Report\StatusChangePublisher:
        autowire: true
        arguments:
            $application: '%messenger_monitoring.application%'
            $environment: '%messenger_monitoring.environment%'

    SickDoggy\MessengerMonitoring\Attribute\MonitoringIdResolver:
        autowire: true

    SickDoggy\MessengerMonitoring\Attribute\NameResolver:
        autowire: true

    SickDoggy\MessengerMonitoring\Attribute\TagsResolver:
        autowire: true

    SickDoggy\MessengerMonitoring\Attribute\MessageContextFactory:
        autowire: true

    SickDoggy\MessengerMonitoring\Attribute\PayloadResolver:
        autowire: true

    SickDoggy\MessengerMonitoring\Attribute\ProcessIdResolver:
        autowire: true

    SickDoggy\MessengerMonitoring\Context\ProcessContext:
        autowire: true

    SickDoggy\MessengerMonitoring\EventSubscriber\HttpProcessIdSubscriber:
        autowire: true
        arguments:
            $headerName: '%messenger_monitoring.process_header_name%'
        tags:
            - { name: kernel.event_subscriber }
